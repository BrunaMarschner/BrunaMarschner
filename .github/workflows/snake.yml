name: Gerar cobrinha de contribuições

on:
  schedule:
    - cron: "0 3 * * *"   # todo dia
  workflow_dispatch:      # botão "Run workflow" pra rodar na hora

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#ec4899&color_dots=#1e1b3a,#3b2a6b,#5b3fa8,#7c3aed,#a78bfa

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
